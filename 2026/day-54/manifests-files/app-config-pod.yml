apiVersion: v1
kind: Pod
metadata:
  name: app-config-pod
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - 'echo "ENV=$APP_ENV DEBUG=$APP_DEBUG PORT=$APP_PORT"; sleep 3600'
      envFrom:
        - configMapRef:
            name: app-config
