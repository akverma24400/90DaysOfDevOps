apiVersion: v1
kind: Pod
metadata:
  name: live-config-pod
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - 'while true; do cat /config/message; sleep 5; done'
      volumeMounts:
        - name: live-config
          mountPath: /config
          readOnly: true
  volumes:
    - name: live-config
      configMap:
        name: live-config
