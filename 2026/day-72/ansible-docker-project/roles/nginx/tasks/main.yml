
# SPDX-License-Identifier: MIT-0
---
# Nginx installation and configuration

# 1. Install Nginx
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes
  become: yes
  tags:
    - nginx

# 2. Start and enable Nginx
- name: Start and enable Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
  when: not ansible_check_mode
  become: yes
  tags:
    - nginx

# 3. Allow HTTP traffic through UFW if enabled
- name: Allow HTTP traffic through UFW
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when:
    - not ansible_check_mode
    - ansible_facts.services['ufw.service'] is defined
      and ansible_facts.services['ufw.service'].state == 'running'
  become: yes
  tags:
    - nginx

